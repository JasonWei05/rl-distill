# 33x33 maze: depth-first + 0-20% wall knockout, eps 0.3 demonstrations (~28% of them shortest paths)
task: {name: maze, size: 33, eps: 0.3, k_min: 0.0, k_max: 0.2}
max_response: 576            # demonstrations (a self-avoiding walk visits at most ~560 cells) and SFT sequences
data: {n_train: 1300000, seed_base: 70000000}
sft: {batch: 128, lr: 5.0e-4, data_seed: 0, max_steps: 40000, log_every: 50, save_every: 100, screen_every: 500,
      screen_k: 16, stop_at: 0.13}
tune: {levels: {p1: 0.01, p3: 0.03, p10: 0.10}, window: 200, k: 256, confirm_k: 1024, tol: 0.05, max_iters: 6}
decode: {max_new: 448, mem_gb: 16.0}  # sampling (screens, tuning, RL): response cap, KV-cache budget per chunk (GB)
# rl.batches: prompts per step per model size, about equal FLOPs per step across sizes in each position (2XS : XS : S
# FLOPs per sample ~ 1 : 2 : 3-4); rl.micro: update micro-batch (samples) per prompts per mini-batch; rl.gpus: data-parallel
# GPUs per prompts sampled per step (8192 / 16384: plan.py --minibatches 4 at 2048 / 4096)
rl: {n: 16, lr: 1.0e-5, warmup: 20, tis_cap: 2.0, patience: 100000, test_freq: 20, val_prompts: 500, val_n: 16,
     batches: {2XS: [64, 256, 1024, 4096], XS: [32, 128, 512, 2048], S: [16, 64, 256, 1024]},
     micro: {16: 512, 32: 512, 64: 512, 128: 1024, 256: 1024, 512: 1024, 1024: 1024, 2048: 1024, 4096: 1024},
     gpus: {16: 1, 32: 1, 64: 1, 128: 1, 256: 1, 512: 1, 1024: 2, 2048: 2, 4096: 4, 8192: 4, 16384: 4}}
# pack.py GPU shares (fraction of a GPU a job takes; a multi-GPU job takes its GPUs whole): sft runs, rl runs per prompts per step
pack: {sft: 0.34, rl: {16: 0.125, 32: 0.125, 64: 0.25, 128: 0.25, 256: 0.5, 512: 0.5, 1024: 1.0, 2048: 1.0, 4096: 1.0, 8192: 1.0,
                       16384: 1.0}}
